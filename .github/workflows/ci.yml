# プッシュ・プルリクエストのたびに、バックエンドのテストとフロントの型チェック・ビルドを行う
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  frontend:
    # 型チェック・本番ビルド・画面の自動テスト（偽のバックエンドと本番ビルドのフロントを起動してブラウザで操作する）
    # ビルドを1回で済ませ、ブラウザとビルドの途中結果は使い回す
    runs-on: ubuntu-latest
    # 止まったまま枠を使い続けないよう上限を設ける
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # ビルド確認用のダミー値（本物のキーは使わない）
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy
      PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r ../backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('frontend/package-lock.json') }}-
      - run: npx next build
      # テスト用ブラウザは Playwright の版が変わったときだけ取り直す
      - id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - run: npx playwright test
